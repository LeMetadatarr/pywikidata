[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywikidata"
dynamic = ["version"]
description = "Wikidata SPARQL entity sweeper (~90 typed queries) bulk harvester grouped on the harvestkit engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["wikidata", "sparql", "metadata", "harvestkit", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "harvestkit>=0.1.0a1",
    "requests>=2.25",
    "beautifulsoup4>=4.10",
]

[project.optional-dependencies]
stealth = ["unblock_requests"]
hf = ["datasets", "huggingface_hub", "pyarrow"]
test = ["pytest"]

[project.scripts]
pywikidata-harvest = "pywikidata.harvest:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pywikidata"

[tool.setuptools.packages.find]
include = ["pywikidata*"]

[tool.setuptools.dynamic]
version = {attr = "pywikidata.version.__version__"}
