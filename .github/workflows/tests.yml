name: tests
on:
  push:
    branches: [dev, master, main]
  pull_request:
  workflow_dispatch:

# Self-contained test CI (does not use the org reusable workflows, which new
# repos can't call until an org Actions-policy change). Once that policy is
# enabled, the standard shared workflows take over and this can be removed.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest tests/ -q
